plugins {
    id 'com.android.application'
}

android {
    namespace 'dz.coolray.home'
    compileSdk 34

    defaultConfig {
        applicationId "dz.coolray.home"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
